[package]
name = "ft-lock-layout-editor"
version = "0.2.0"
edition = "2021"
description = "Visual layout / config editor for ft_lock"

[dependencies]
eframe = "0.29"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
